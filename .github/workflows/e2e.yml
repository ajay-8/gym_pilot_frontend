name: E2E Tests

on:
  pull_request:
    branches: [develop]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      deployments: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel preview deployment
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;

            core.info(`Polling for Vercel deployment on commit ${sha}...`);

            for (let attempt = 0; attempt < 30; attempt++) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, per_page: 10,
              });

              for (const dep of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: dep.id, per_page: 5,
                });
                const success = statuses.find(s => s.state === 'success' && s.environment_url);
                if (success) {
                  core.info(`Preview ready: ${success.environment_url}`);
                  core.setOutput('url', success.environment_url);
                  return;
                }
              }

              core.info(`Attempt ${attempt + 1}/30 — not ready yet, retrying in 10s...`);
              await new Promise(r => setTimeout(r, 10000));
            }

            core.setFailed('Timed out waiting for Vercel preview deployment (5 min)');

      - name: Wake up Render backend
        run: curl -s https://gym-pilot-api.onrender.com/health || true

      - name: Run E2E tests
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ steps.vercel.outputs.url }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
